name: Supabase keep-alive

# Une requête par jour pour éviter la mise en pause du projet gratuit Supabase
on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours à 06:17 UTC
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/hunts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
